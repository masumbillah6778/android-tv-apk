<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web Multi Player html">
    <meta name="title" content="Multi Player">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>

    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/custom-scrollbar.css">

    <link rel="icon" type="image/x-icon" href="https://masumbillah6778.github.io/images/lock.png">

    <title> Music Lyrics </title>

    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/android-tv-apk.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/master-multi-media/assets/css/main-page-media-screen-v1.css">
  </head>

  <body>

    <div class="main-content">

      <main>

        <div class="container">

          <section class="section-content">

            <div class="text-heading">
              <p> Music Lyrics </p>
            </div>

            <div class="main-slide-box" id="scrollbar">

              <div id="mai-page-fr" class="lyrics-box">

                <div class="content-box">

                  <div id="overlay"></div>

                  <div class="content">

                    <div class="lyrics"></div>

                  </div>

                  <div class="player">

                    <table>

                      <tr>

                        <td rowspan="2" class="images">

                          <img
                            src="https://masumbillah6778.github.io/images/music-thumbnail-10.jpg"
                            alt="img">

                        </td>

                        <td class="name">

                          <a
                            href="https://youtu.be/PCnNcGCxD9o?si=VYvXMqZER5ckxEIZ"
                            target="_blank">

                            আমার মন পাখি

                          </a>

                        </td>

                      </tr>

                      <tr>

                        <td class="artist">
                          আকাশ মামুদ ও লাইলা
                        </td>

                      </tr>

                      <tr>

                        <td colspan="2" class="video-player">

                          <video
                            controls
                            loop
                            controlslist="nodownload"
                            name="media"
                            oncontextmenu="return false;">

                            <source
                              src="https://masumbillah6778bd.github.io/music-lyrics/music/amar-mon-pakhi.mp3"
                              type="audio/mpeg" />

                          </video>

                        </td>

                      </tr>

                    </table>

                  </div>

                </div>

              </div>

            </div>

          </section>

        </div>

      </main>

    </div>


    <!-- Existing Scripts -->

    <script src="https://masumbillah6778.github.io/multi-player/assets/js/hover-auto-play.js"></script>

    <script src="https://masumbillah6778.github.io/js/toggle-dark-light.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

    <script
      type="module"
      src="https://masumbillah6778.github.io/music-lyrics/js/amar-mon-pakhi.js">
    </script>

    <script
      type="module"
      src="https://masumbillah6778.github.io/js/android-tv-remote-control-apk.js">


    <!-- ==================================================
         TV REMOTE BACK BUTTON
         ================================================== -->

    <script>

      document.addEventListener("keydown", function (event) {

        const backKeys = [

          "Escape",
          "Backspace",
          "BrowserBack",
          "GoBack"

        ];


        if (

          backKeys.includes(event.key) ||

          event.keyCode === 4 ||

          event.keyCode === 10009

        ) {

          event.preventDefault();


          if (window.history.length > 1) {

            window.history.back();

          }

          else {

            window.location.href = "index.html";

          }

        }

      });

    </script>


  </body>

</html>
