<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Android Tv html">
    <meta name="title" content="Android Tv">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="icon" type="image/x-icon" href="https://masumbillah6778.github.io/images/icon/music-icon1.png">
    <title>মিউজিক অ্যালবাম</title>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/android-tv.css">
</head>

<body>

<div class="dashboard" id="dashboard" tabindex="0">

<header>

    <div class="header-left">
        <div class="home-icon">⌂</div>

        <div>
            <div class="brand">Google TV™</div>
            <div class="subtitle">স্মার্ট তথ্য ব্যবস্থাপনা অ্যাপ</div>
        </div>
    </div>

    <div class="header-center">সকল মিউজিক অ্যালবাম</div>

    <div class="header-right">

        <div class="wifi-box">

            <svg id="wifiIcon" viewBox="0 0 24 24">
                <path
                    id="wifiPath"
                    d="M2 8.5C7.5 3.8 16.5 3.8 22 8.5M5 12c3.9-3.3 10.1-3.3 14 0M8.5 15.5c2-1.7 5-1.7 7 0M12 19h.01"
                    fill="none"
                    stroke="#45e68a"
                    stroke-width="2"
                    stroke-linecap="round"
                />
            </svg>

            <span id="wifiText">অনলাইন</span>
        </div>

        <div class="clock" id="clock"></div>

        <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="সেটিংস"
        >⚙</button>

    </div>

</header>

<main class="card-grid" id="cardGrid"></main>

</div>

<div class="wave"></div>


<!-- SETTINGS MODAL -->

<div class="modal-overlay" id="settingsModal">

    <div class="modal">

        <button
            class="modal-close"
            onclick="closeModal('settingsModal')"
        >×</button>

        <h2>⚙ সেটিংস</h2>

        <div class="settings-list">

            <button
                class="settings-option"
                onclick="openDetailsFromSettings()"
            >
                📋 সকল কার্ডের বিস্তারিত দেখুন
            </button>

        </div>

    </div>

</div>


<!-- PASSWORD MODAL -->

<div class="modal-overlay" id="passwordModal">

    <div class="modal">

        <button
            class="modal-close"
            onclick="closeModal('passwordModal')"
        >×</button>

        <div class="password-box">

            <div class="lock-big">🔒</div>

            <h2 id="passwordCardName">পাসওয়ার্ড প্রয়োজন</h2>

            <p>এই কার্ডে প্রবেশ করতে পাসওয়ার্ড দিন</p>

            <div class="password-wrap">

                <input
                    id="enterPassword"
                    type="password"
                    placeholder="পাসওয়ার্ড লিখুন"
                    onkeydown="if(event.key==='Enter')checkPassword();"
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('enterPassword',this)"
                >👁️</button>

            </div>

            <div class="error-message" id="passwordError"></div>

            <div class="form-buttons">

                <button
                    class="btn btn-cancel"
                    onclick="closeModal('passwordModal')"
                >
                    বাতিল
                </button>

                <button
                    class="btn btn-save"
                    onclick="checkPassword()"
                >
                    🔓 প্রবেশ করুন
                </button>

            </div>

        </div>

    </div>

</div>


<!-- DETAILS MODAL -->

<div class="modal-overlay" id="detailsModal">

    <div class="modal large">

        <button
            class="modal-close"
            onclick="closeModal('detailsModal')"
        >×</button>

        <h2>📋 সকল কার্ডের বিস্তারিত</h2>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>নং</th>
                        <th>কার্ডের নাম</th>
                        <th>সাবটাইটেল</th>
                        <th>পাসওয়ার্ড</th>
                        <th>URL</th>
                    </tr>
                </thead>

                <tbody id="detailsTableBody"></tbody>

            </table>

        </div>

    </div>

</div>


<script src="https://masumbillah6778.github.io/android-tv-apk/js/music-album.js"></script>

</body>
</html>
