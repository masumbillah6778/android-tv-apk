<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Android Tv html">
    <meta name="title" content="Android Tv">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="icon" type="image/x-icon" href="https://masumbillah6778.github.io/images/icon/music-icon1.png">
    <title>Google TV™</title>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/android-tv.css">
</head>

<body>

<div class="dashboard" id="dashboard" tabindex="0">

<header>

    <div class="header-left">
        <div class="home-icon">⌂</div>

        <div>
            <div class="brand">Google TV™</div>
            <div class="subtitle">স্মার্ট তথ্য ব্যবস্থাপনা অ্যাপ</div>
        </div>
    </div>

    <div class="header-center">সকল মিউজিক লিরিক</div>

    <div class="header-right">

        <div class="wifi-box">

            <svg id="wifiIcon" viewBox="0 0 24 24">
                <path
                    id="wifiPath"
                    d="M2 8.5C7.5 3.8 16.5 3.8 22 8.5M5 12c3.9-3.3 10.1-3.3 14 0M8.5 15.5c2-1.7 5-1.7 7 0M12 19h.01"
                    fill="none"
                    stroke="#45e68a"
                    stroke-width="2"
                    stroke-linecap="round"
                />
            </svg>

            <span id="wifiText">অনলাইন</span>
        </div>

        <div class="clock" id="clock"></div>

        <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="সেটিংস"
        >⚙</button>

    </div>

</header>

<main class="card-grid" id="cardGrid"></main>

</div>

<div class="wave"></div>


<!-- SETTINGS MODAL -->

<div class="modal-overlay" id="settingsModal">

    <div class="modal">

        <button
            class="modal-close"
            onclick="closeModal('settingsModal')"
        >×</button>

        <h2>⚙ সেটিংস</h2>

        <div class="settings-list">

            <button
                class="settings-option"
                onclick="openDetailsFromSettings()"
            >
                📋 সকল কার্ডের বিস্তারিত দেখুন
            </button>

        </div>

    </div>

</div>


<!-- PASSWORD MODAL -->

<div class="modal-overlay" id="passwordModal">

    <div class="modal">

        <button
            class="modal-close"
            onclick="closeModal('passwordModal')"
        >×</button>

        <div class="password-box">

            <div class="lock-big">🔒</div>

            <h2 id="passwordCardName">পাসওয়ার্ড প্রয়োজন</h2>

            <p>এই কার্ডে প্রবেশ করতে পাসওয়ার্ড দিন</p>

            <div class="password-wrap">

                <input
                    id="enterPassword"
                    type="password"
                    placeholder="পাসওয়ার্ড লিখুন"
                    onkeydown="if(event.key==='Enter')checkPassword();"
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword('enterPassword',this)"
                >👁️</button>

            </div>

            <div class="error-message" id="passwordError"></div>

            <div class="form-buttons">

                <button
                    class="btn btn-cancel"
                    onclick="closeModal('passwordModal')"
                >
                    বাতিল
                </button>

                <button
                    class="btn btn-save"
                    onclick="checkPassword()"
                >
                    🔓 প্রবেশ করুন
                </button>

            </div>

        </div>

    </div>

</div>


<!-- DETAILS MODAL -->

<div class="modal-overlay" id="detailsModal">

    <div class="modal large">

        <button
            class="modal-close"
            onclick="closeModal('detailsModal')"
        >×</button>

        <h2>📋 সকল কার্ডের বিস্তারিত</h2>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>নং</th>
                        <th>কার্ডের নাম</th>
                        <th>সাবটাইটেল</th>
                        <th>পাসওয়ার্ড</th>
                        <th>URL</th>
                    </tr>
                </thead>

                <tbody id="detailsTableBody"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================================
   APP ID

   প্রতিটি HTML কপির জন্য আলাদা ID দিন।
========================================================= */

const APP_ID = "google-tv-copy-01";

const STORAGE_PREFIX = "google-tv-app:" + APP_ID + ":";


/* =========================================================
   CARD CONFIGURATION

   HTML থেকে কার্ড যুক্ত / পরিবর্তন / ডিলেট করবেন।
========================================================= */

const defaultCards = [

    {
        title:"পাখি গেছে আমার উড়িয়া",
        subtitle:"আকাশ মামুদ ও লাইলা",
        icon:"https://masumbillah6778.github.io/images/music-cover-photo/akash-mahmud.jpg",
        color:"blue",
        url:"https://masumbillah6778.github.io/android-tv-apk/card/music-lyric/amar-mon-pakhi.html",
        password:""
    },

    {
        title:"আমার দিন গুলো",
        subtitle:"হাবিব ওয়াহিদ",
        icon:"https://masumbillah6778.github.io/images/music-cover-photo/habib-ohid.jpg",
        color:"royal",
        url:"https://masumbillah6778.github.io/android-tv-apk/card/music-lyric/amar-din-gulo-sob.html",
        password:""
    },

    {
        title:"ব্যাক",
        subtitle:"(ডাউনলোড/আপলোড)",
        icon:"☁️",
        color:"teal",
        url:"#",
        password:"1234"
    }

];


/* =========================================================
   SOURCE OF TRUTH

   কার্ডের তালিকা HTML থেকেই আসবে।
   LocalStorage কার্ডের তালিকাকে পরিবর্তন করবে না।
========================================================= */

let cards = defaultCards.map(card => ({ ...card }));


/* ELEMENTS */

const cardGrid = document.getElementById("cardGrid");
const dashboard = document.getElementById("dashboard");

let selectedIndex = 0;
let pendingCardIndex = -1;


/* =========================================================
   ERROR DETECTION
========================================================= */

window.addEventListener("error", function(event) {

    console.error(
        "APP ID:",
        APP_ID,
        "JavaScript Error:",
        event.message,
        "Line:",
        event.lineno
    );

});


/* =========================================================
   ICON
========================================================= */

function isImageUrl(value) {

    return /^https?:\/\/.+/i.test(
        String(value || "").trim()
    );

}


function createIcon(value) {

    const box = document.createElement("div");

    box.className = "card-icon";

    if (isImageUrl(value)) {

        const img = document.createElement("img");

        img.src = value;
        img.alt = "";

        img.onerror = function() {

            this.style.display = "none";
            box.textContent = "📺";

        };

        box.appendChild(img);

    } else {

        box.textContent = value || "📺";

    }

    return box;

}


/* =========================================================
   RENDER CARDS
========================================================= */

function renderCards() {

    cardGrid.innerHTML = "";

    cards.forEach((card,index) => {

        const a = document.createElement("a");

        a.href = "#";

        a.className = "card " + (card.color || "blue");

        a.dataset.index = index;

        a.addEventListener("click",function(event) {

            event.preventDefault();

            selectedIndex = index;

            updateSelection();

            openCard(index);

        });


        a.appendChild(createIcon(card.icon));


        const title = document.createElement("div");

        title.className = "card-title";

        title.textContent = card.title || "নতুন কার্ড";

        a.appendChild(title);


        const subtitle = document.createElement("div");

        subtitle.className = "card-subtitle";

        subtitle.textContent = card.subtitle || "";

        a.appendChild(subtitle);


        if (String(card.password || "").trim() !== "") {

            const lock = document.createElement("button");

            lock.type = "button";

            lock.className = "card-lock";

            lock.textContent = "🔒";

            lock.title = "পাসওয়ার্ডযুক্ত কার্ড";

            lock.addEventListener("click",function(event) {

                event.preventDefault();

                event.stopPropagation();

                selectedIndex = index;

                updateSelection();

                openPasswordModal(index);

            });

            a.appendChild(lock);

        }

        cardGrid.appendChild(a);

    });

    updateSelection();

}


/* =========================================================
   SELECTION
========================================================= */

function updateSelection() {

    const all = document.querySelectorAll(".card");

    all.forEach((card,index) => {

        card.classList.toggle(
            "selected",
            index === selectedIndex
        );

    });

}


/* =========================================================
   OPEN CARD
========================================================= */

function openCard(index) {

    if (!cards[index]) return;

    const card = cards[index];

    if (String(card.password || "").trim() === "") {

        navigateToCard(index);

    } else {

        openPasswordModal(index);

    }

}


function navigateToCard(index) {

    const card = cards[index];

    if (!card || !card.url) return;

    if (card.url === "#") return;

    window.location.href = card.url;

}


/* =========================================================
   PASSWORD MODAL
========================================================= */

function openPasswordModal(index) {

    pendingCardIndex = index;

    document.getElementById(
        "passwordCardName"
    ).textContent = cards[index].title || "কার্ড";

    document.getElementById(
        "enterPassword"
    ).value = "";

    document.getElementById(
        "passwordError"
    ).textContent = "";

    showModal("passwordModal");

    setTimeout(() => {

        document.getElementById(
            "enterPassword"
        ).focus();

    },100);

}


function checkPassword() {

    if (pendingCardIndex < 0) return;

    const card = cards[pendingCardIndex];

    if (!card) return;

    const entered =
        document.getElementById("enterPassword").value;

    if (entered === card.password) {

        document.getElementById(
            "passwordError"
        ).textContent = "";

        const index = pendingCardIndex;

        closeModal("passwordModal");

        pendingCardIndex = -1;

        navigateToCard(index);

    } else {

        const error =
            document.getElementById("passwordError");

        error.textContent =
            "আপনি ভুল পাসওয়ার্ড দিয়েছেন";

        error.style.color = "#ff3d3d";

        try {

            if ("speechSynthesis" in window) {

                window.speechSynthesis.cancel();

                const speech =
                    new SpeechSynthesisUtterance(
                        "আপনি ভুল পাসওয়ার্ড দিয়েছেন"
                    );

                speech.lang = "bn-BD";

                speech.rate = 0.9;

                window.speechSynthesis.speak(speech);

            }

        } catch(e) {}

        document.getElementById(
            "enterPassword"
        ).focus();

    }

}


/* =========================================================
   DETAILS: READ ONLY
========================================================= */

function openDetailsFromSettings() {

    closeModal("settingsModal");

    renderDetailsTable();

    showModal("detailsModal");

}


function renderDetailsTable() {

    const tbody =
        document.getElementById("detailsTableBody");

    tbody.innerHTML = "";

    cards.forEach((card,index) => {

        const tr = document.createElement("tr");


        const noTd = document.createElement("td");

        noTd.textContent = index + 1;

        tr.appendChild(noTd);


        const nameTd = document.createElement("td");

        nameTd.textContent = card.title || "";

        tr.appendChild(nameTd);


        const subTd = document.createElement("td");

        subTd.textContent = card.subtitle || "";

        tr.appendChild(subTd);


        const passwordTd = document.createElement("td");

        const passwordValue = document.createElement("span");

        passwordValue.className = "password-value";


        if (String(card.password || "").trim() !== "") {

            passwordValue.textContent = "••••••";

        } else {

            passwordValue.textContent = "পাসওয়ার্ড নেই";

            passwordValue.style.color = "#9aa9ca";

        }

        passwordTd.appendChild(passwordValue);

        tr.appendChild(passwordTd);


        const urlTd = document.createElement("td");

        if (card.url) {

            const urlText = document.createElement("span");

            urlText.textContent = card.url;

            urlText.style.maxWidth = "350px";

            urlText.style.display = "inline-block";

            urlText.style.overflow = "hidden";

            urlText.style.textOverflow = "ellipsis";

            urlText.style.whiteSpace = "nowrap";

            urlTd.appendChild(urlText);

        } else {

            urlTd.textContent = "—";

        }

        tr.appendChild(urlTd);

        tbody.appendChild(tr);

    });

}


/* =========================================================
   PASSWORD EYE
========================================================= */

function togglePassword(inputId,button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

    } else {

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* =========================================================
   MODAL
========================================================= */

function showModal(id) {

    document
        .getElementById(id)
        .classList.add("show");

}


function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("show");

}


/* SETTINGS BUTTON */

document
    .getElementById("settingsBtn")
    .addEventListener("click",function() {

        showModal("settingsModal");

    });


/* OUTSIDE CLICK */

document
    .querySelectorAll(".modal-overlay")
    .forEach(overlay => {

        overlay.addEventListener("click",function(event) {

            if (event.target === overlay) {

                overlay.classList.remove("show");

            }

        });

    });


/* =========================================================
   TV REMOTE NAVIGATION
========================================================= */

function getCardCenter(el) {

    const r = el.getBoundingClientRect();

    return {

        x: r.left + r.width / 2,

        y: r.top + r.height / 2

    };

}


function findNextCard(direction) {

    const elements =
        [...document.querySelectorAll(".card")];

    if (elements.length === 0) return -1;

    const current = elements[selectedIndex];

    if (!current) return -1;

    const c = getCardCenter(current);

    let bestIndex = -1;

    let bestScore = Infinity;


    elements.forEach((el,index) => {

        if (index === selectedIndex) return;

        const p = getCardCenter(el);

        const dx = p.x - c.x;

        const dy = p.y - c.y;

        let primary;

        let secondary;


        if (direction === "right") {

            if (dx <= 5) return;

            primary = dx;

            secondary = Math.abs(dy);

        }

        else if (direction === "left") {

            if (dx >= -5) return;

            primary = -dx;

            secondary = Math.abs(dy);

        }

        else if (direction === "down") {

            if (dy <= 5) return;

            primary = dy;

            secondary = Math.abs(dx);

        }

        else if (direction === "up") {

            if (dy >= -5) return;

            primary = -dy;

            secondary = Math.abs(dx);

        }


        const score = primary * 10 + secondary;

        if (score < bestScore) {

            bestScore = score;

            bestIndex = index;

        }

    });

    return bestIndex;

}


function moveSelection(direction) {

    const next = findNextCard(direction);

    if (next !== -1) {

        selectedIndex = next;

        updateSelection();

        const card =
            document.querySelectorAll(".card")[next];

        if (card) {

            card.scrollIntoView({

                behavior:"smooth",

                block:"nearest",

                inline:"nearest"

            });

        }

    }

}


/* =========================================================
   TV REMOTE KEYBOARD
========================================================= */

document.addEventListener("keydown",function(event) {

    const key = event.key;

    const code = event.keyCode;

    const modalOpen =
        document.querySelector(".modal-overlay.show");


    if (modalOpen) {

        if (
            key === "Escape" ||
            key === "Backspace" ||
            key === "BrowserBack" ||
            key === "GoBack" ||
            code === 4 ||
            code === 10009
        ) {

            event.preventDefault();

            modalOpen.classList.remove("show");

        }

        return;

    }


    if (key === "ArrowRight") {

        event.preventDefault();

        moveSelection("right");

        return;

    }


    if (key === "ArrowLeft") {

        event.preventDefault();

        moveSelection("left");

        return;

    }


    if (key === "ArrowDown") {

        event.preventDefault();

        moveSelection("down");

        return;

    }


    if (key === "ArrowUp") {

        event.preventDefault();

        moveSelection("up");

        return;

    }


    if (
        key === "Enter" ||
        key === " " ||
        code === 13 ||
        code === 23
    ) {

        event.preventDefault();

        openCard(selectedIndex);

        return;

    }


    if (
        key === "Escape" ||
        key === "Backspace" ||
        key === "BrowserBack" ||
        key === "GoBack" ||
        code === 4 ||
        code === 10009
    ) {

        event.preventDefault();

        if (window.history.length > 1) {

            window.history.back();

        }

    }

});


/* =========================================================
   WIFI
========================================================= */

function updateWifiStatus() {

    const icon = document.getElementById("wifiPath");

    const text = document.getElementById("wifiText");


    if (navigator.onLine) {

        icon.setAttribute("stroke","#45e68a");

        text.textContent = "অনলাইন";

        text.style.color = "#45e68a";

    } else {

        icon.setAttribute("stroke","#ff3d3d");

        text.textContent = "অফলাইন";

        text.style.color = "#ff3d3d";

    }

}


window.addEventListener("online",updateWifiStatus);

window.addEventListener("offline",updateWifiStatus);


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const time =
        now.toLocaleTimeString("en-US",{

            hour:"numeric",

            minute:"2-digit",

            hour12:true

        });

    document.getElementById("clock").textContent = time;

}


/* =========================================================
   INITIAL LOAD
========================================================= */

try {

    renderCards();

    updateWifiStatus();

    updateClock();

    setInterval(updateClock,1000);

    setTimeout(() => {

        dashboard.focus();

    },200);

} catch(error) {

    console.error(
        "APP ID:",
        APP_ID,
        "INITIAL LOAD ERROR:",
        error
    );

}

</script>

</body>
</html>
