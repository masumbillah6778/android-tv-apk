<!-- PLAYER CONTROL -->

<script>
(function () {

"use strict";

const player = document.getElementById("mainAudioPlayer");

if (!player) return;

player.setAttribute("tabindex", "0");

player.setAttribute("aria-label", "গান চালানো ও নিয়ন্ত্রণ");


/* PLAY FUNCTION */

function playVideo() {

if (!player.paused) return;

const result = player.play();

if (result && typeof result.catch === "function") {

result.catch(function(error) {

console.error("Audio Play Error:", error);

});

}

}


/* PAUSE FUNCTION */

function pauseVideo() {

if (!player.paused) {
player.pause();
}

}


/* TOGGLE FUNCTION */

function togglePlayPause() {

if (player.paused || player.ended) {
playVideo();
} else {
pauseVideo();
}

}


/* MOUSE / TOUCH CONTROL */

player.addEventListener("click", function(event) {

if (event.target !== player) return;

try {
player.focus({preventScroll:true});
} catch(error) {
player.focus();
}

});


/* KEYBOARD / TV REMOTE CONTROL */

window.addEventListener("keydown", function(event) {

const key = event.key || "";
const code = event.code || "";
const keyCode = event.keyCode || event.which || 0;


/* MEDIA PLAY / PAUSE */

const isPlay =
key === "MediaPlay" ||
code === "MediaPlay" ||
keyCode === 126;

const isPause =
key === "MediaPause" ||
code === "MediaPause" ||
keyCode === 127;

const isToggle =
key === "MediaPlayPause" ||
code === "MediaPlayPause" ||
keyCode === 85 ||
keyCode === 179;

if (isPlay || isPause || isToggle) {

event.preventDefault();
event.stopPropagation();

if (isPlay) {
playVideo();
}
else if (isPause) {
pauseVideo();
}
else {
togglePlayPause();
}

return;

}


/* PLAYER FOCUS */

const playerFocused = document.activeElement === player;

if (!playerFocused) return;


/* ENTER / OK */

if (
key === "Enter" ||
key === " " ||
key === "Select" ||
code === "NumpadEnter" ||
keyCode === 23
) {

event.preventDefault();
event.stopPropagation();

togglePlayPause();

return;

}


/* LEFT = 10 SECOND BACK */

if (key === "ArrowLeft" || keyCode === 21) {

event.preventDefault();

player.currentTime = Math.max(
0,
player.currentTime - 10
);

return;

}


/* RIGHT = 10 SECOND FORWARD */

if (key === "ArrowRight" || keyCode === 22) {

event.preventDefault();

if (Number.isFinite(player.duration)) {

player.currentTime = Math.min(
player.duration,
player.currentTime + 10
);

}

return;

}


/* UP = VOLUME UP */

if (key === "ArrowUp" || keyCode === 19) {

event.preventDefault();

player.volume = Math.min(
1,
player.volume + 0.1
);

player.muted = false;

return;

}


/* DOWN = VOLUME DOWN */

if (key === "ArrowDown" || keyCode === 20) {

event.preventDefault();

player.volume = Math.max(
0,
player.volume - 0.1
);

return;

}

}, true);


/* PAGE LOAD */

window.addEventListener("load", function() {

setTimeout(function() {

try {
player.focus({preventScroll:true});
} catch(error) {
player.focus();
}

}, 500);

});


/* AUDIO ERROR */

player.addEventListener("error", function() {

console.error(
"Audio file could not load:",
player.error
);

});

})();
</script>


<!-- TV REMOTE BACK BUTTON -->

<script>

document.addEventListener("keydown", function(event) {

const backKeys = [
"Escape",
"Backspace",
"BrowserBack",
"GoBack"
];

if (
backKeys.includes(event.key) ||
event.keyCode === 4 ||
event.keyCode === 10009
) {

event.preventDefault();

if (window.history.length > 1) {
window.history.back();
}
else {
window.location.href = "index.html";
}

}

});

</script>
