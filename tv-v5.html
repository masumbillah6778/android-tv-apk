    <!-- Existing Scripts -->

    <script src="https://masumbillah6778.github.io/multi-player/assets/js/hover-auto-play.js"></script>

    <script
      type="module"
      src="https://masumbillah6778.github.io/js/android-tv-remote-back-button.js">

    <!-- ==================================================
         TV REMOTE CONTROL
         PLAY / PAUSE + SEEK + VOLUME
         ================================================== -->

    <script>

      (function () {

        const player = document.querySelector(".player video");

        if (!player) return;


        /* ==================================================
           PLAYER SETUP
           ================================================== */

        player.setAttribute("tabindex", "0");

        player.setAttribute(
          "aria-label",
          "গান চালানো ও নিয়ন্ত্রণ"
        );


        /* Player click করলে focus */
        player.addEventListener("click", function () {

          try {
            player.focus({ preventScroll: true });
          } catch (e) {
            player.focus();
          }

        });


        /* ==================================================
           PLAY / PAUSE FUNCTION
           ================================================== */

        function playVideo() {

          try {

            const promise = player.play();

            if (promise && typeof promise.catch === "function") {

              promise.catch(function () {
                // Browser autoplay restriction থাকলে error ignore
              });

            }

          } catch (e) {
            // Ignore
          }

        }


        function pauseVideo() {

          try {
            player.pause();
          } catch (e) {
            // Ignore
          }

        }


        function togglePlayPause() {

          if (player.paused || player.ended) {

            playVideo();

          } else {

            pauseVideo();

          }

        }


        /* ==================================================
           TV REMOTE KEY DETECTION
           ================================================== */

        window.addEventListener(
          "keydown",
          function (event) {

            const key =
              event.key || "";

            const code =
              event.code || "";

            const keyCode =
              event.keyCode ||
              event.which ||
              0;


            /* ==================================================
               PLAY / PAUSE REMOTE KEYS

               85   = কিছু TV Remote-এর Play/Pause
               179  = Media Play/Pause
               126  = Media Play
               127  = Media Pause
               ================================================== */

            const isMediaPlayPause =
              key === "MediaPlayPause" ||
              code === "MediaPlayPause" ||

              key === "MediaPlay" ||
              code === "MediaPlay" ||

              key === "MediaPause" ||
              code === "MediaPause" ||

              keyCode === 85 ||
              keyCode === 179 ||
              keyCode === 126 ||
              keyCode === 127;


            if (isMediaPlayPause) {

              event.preventDefault();
              event.stopPropagation();


              /* -------------------------------
                 আলাদা Play button
                 ------------------------------- */

              if (
                key === "MediaPlay" ||
                code === "MediaPlay" ||
                keyCode === 126
              ) {

                playVideo();

              }


              /* -------------------------------
                 আলাদা Pause button
                 ------------------------------- */

              else if (
                key === "MediaPause" ||
                code === "MediaPause" ||
                keyCode === 127
              ) {

                pauseVideo();

              }


              /* -------------------------------
                 Play / Pause toggle
                 ------------------------------- */

              else {

                togglePlayPause();

              }

              return;

            }


            /* ==================================================
               PLAYER FOCUS CHECK
               ================================================== */

            const active =
              document.activeElement;

            const playerFocused =
              active === player ||
              (active && player.contains(active));


            /*
             * D-Pad / OK controls শুধুমাত্র
             * Player focus থাকলে কাজ করবে।
             */

            if (!playerFocused) {

              return;

            }


            /* ==================================================
               OK / ENTER = PLAY / PAUSE
               ================================================== */

            if (

              key === "Enter" ||
              key === " " ||
              key === "Select" ||

              code === "Enter" ||
              code === "NumpadEnter" ||

              keyCode === 13 ||
              keyCode === 23

            ) {

              event.preventDefault();
              event.stopPropagation();

              togglePlayPause();

              return;

            }


            /* ==================================================
               LEFT = 10 SECOND BACK
               ================================================== */

            if (

              key === "ArrowLeft" ||
              code === "ArrowLeft" ||
              keyCode === 21

            ) {

              event.preventDefault();

              player.currentTime =
                Math.max(
                  0,
                  player.currentTime - 10
                );

              return;

            }


            /* ==================================================
               RIGHT = 10 SECOND FORWARD
               ================================================== */

            if (

              key === "ArrowRight" ||
              code === "ArrowRight" ||
              keyCode === 22

            ) {

              event.preventDefault();

              if (Number.isFinite(player.duration)) {

                player.currentTime =
                  Math.min(
                    player.duration,
                    player.currentTime + 10
                  );

              }

              return;

            }


            /* ==================================================
               UP = VOLUME +
               ================================================== */

            if (

              key === "ArrowUp" ||
              code === "ArrowUp" ||
              keyCode === 19

            ) {

              event.preventDefault();

              player.volume =
                Math.min(
                  1,
                  player.volume + 0.1
                );

              player.muted = false;

              return;

            }


            /* ==================================================
               DOWN = VOLUME -
               ================================================== */

            if (

              key === "ArrowDown" ||
              code === "ArrowDown" ||
              keyCode === 20

            ) {

              event.preventDefault();

              player.volume =
                Math.max(
                  0,
                  player.volume - 0.1
                );

              return;

            }

          },

          true
        );


        /* ==================================================
           PAGE LOAD
           PLAYER FOCUS
           ================================================== */

        window.addEventListener(
          "load",
          function () {

            setTimeout(
              function () {

                try {

                  player.focus({
                    preventScroll: true
                  });

                } catch (e) {

                  player.focus();

                }

              },
              500
            );

          }
        );


      })();

    </script>


    <!-- ==================================================
         TV REMOTE BACK BUTTON
         ================================================== -->

    <script>

      document.addEventListener(
        "keydown",
        function (event) {

          const backKeys = [

            "Escape",
            "Backspace",
            "BrowserBack",
            "GoBack"

          ];


          if (

            backKeys.includes(event.key) ||

            event.keyCode === 4 ||

            event.keyCode === 10009

          ) {

            event.preventDefault();


            if (window.history.length > 1) {

              window.history.back();

            }

            else {

              window.location.href =
                "index.html";

            }

          }

        }
      );

    </script>


  </body>
