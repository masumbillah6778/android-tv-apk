<style>
  .clock {
  font-size: clamp(20px, 2.4vw, 32px);
  white-space: nowrap;
}
</style>


<div id="audio-player">
     <audio controls loop>
        <source src="https://github.com/masumbillah6778bd/bangladesh-sad-music/raw/main/shikol-beri-2.mp3" type="audio/mpeg"/>
      </audio>
    </div>



<script>
function updateClock() {

  const now = new Date();

  const time = now.toLocaleTimeString("en-US", {

    hour: "numeric",
    minute: "2-digit",
    hour12: true

  });

  document.getElementById("clock").textContent = time;

}

updateClock();

setInterval(updateClock, 1000);

</script>
