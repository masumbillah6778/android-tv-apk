<script>
function updateClock() {

  const now = new Date();

  const time = now.toLocaleTimeString("en-US", {

    hour: "numeric",
    minute: "2-digit",
    hour12: true

  });

  document.getElementById("clock").textContent = time;

}

updateClock();

setInterval(updateClock, 1000);

</script>
